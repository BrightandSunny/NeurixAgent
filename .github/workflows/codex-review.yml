name: Codex Review (PR/Dispatch)
on:
  workflow_dispatch:
  pull_request:
    branches: ["main", "release/*"]

permissions:
  contents: write
  actions: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Git sanitize (quiet)
        shell: bash
        run: |
          set -euo pipefail
          git --version                                  || :
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || :
          git config --global --add safe.directory "*"   || :
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com" || :
          git config --global user.name  "github-actions[bot]"                                   || :
          git rev-parse --is-inside-work-tree            || :
          git status --porcelain=v2                      || :

      - uses: actions/setup-node@v4
        with:
          node-version: "18.19.1"

      - name: Enable corepack + pin Yarn 1.22.22
        run: corepack enable && yarn set version 1.22.22

      - name: Cache Yarn
        uses: actions/cache@v4
        with:
          path: ~/.cache/yarn
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}

      - name: Install deps (frozen)
        run: yarn install --frozen-lockfile

      # Your review tool runs here; we just call your stub script
      - name: Generate Review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: yarn codex:review
        continue-on-error: true

      - name: Upload Review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-review
          path: codex-review.md
          if-no-files-found: warn
