# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Codex Review (PR/Dispatch)

on:
  workflow_dispatch: {}
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches:
      - main
      - "release/**"

permissions:
  contents: read
  actions: read
  pull-requests: write

concurrency:
  group: codex-review-${{ github.ref }}
  cancel-in-progress: true

# Only run on manual dispatch or PRs labeled "codex"
jobs:
  review:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'codex')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Quiet the intermittent git 128 and avoid ssh/git:// in transitive deps
      - name: Git sanitize (quiet)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true
          git config --global url."https://".insteadOf git://
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

      - name: Setup Node (cache Yarn)
        uses: actions/setup-node@v4
        with:
          node-version: "18.19.1"
          cache: yarn

      - name: Enable Corepack + pin Yarn 1.22.22
        run: |
          corepack enable
          yarn set version 1.22.22

      - name: Install deps (frozen)
        run: yarn install --frozen-lockfile

      # Run even if OPENAI_API_KEY is missing; we’ll still produce an artifact
      - name: Run Codex review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: yarn codex:review
        continue-on-error: true

      # Ensure we always upload something for operator ergonomics
      - name: Ensure review artifact exists
        run: |
          test -f codex-review.md || printf "# Codex Review\nStatus: stub\nRun: %s\n" "${GITHUB_RUN_ID}" > codex-review.md

      - name: Upload review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-review
          path: codex-review.md
          if-no-files-found: warn

      - name: Comment review on PR
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          script: |
            const runId = process.env.GITHUB_RUN_ID;
            const body = [
              "### Codex Review",
              `Run ID: ${runId}`,
              "Artifact: **codex-review**",
              "",
              "Open run:",
              `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}`,
              "",
              "Download with GitHub CLI:",
              `gh run download ${runId} -n codex-review -D .artifacts`
            ].join("\n");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body
            });
