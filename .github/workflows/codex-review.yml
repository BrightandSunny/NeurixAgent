name: codex-review
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
          persist-credentials: true
          submodules: false

      - uses: actions/setup-node@v4
        with:
          node-version: '18.19.1'

      - name: Git sanitize (non-fatal)
        continue-on-error: true
        shell: bash
        run: |
          git --version
          git config --global --add safe.directory "*"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name  "github-actions[bot]"
          echo ".sandbox" >> .git/info/exclude || true
          git status --porcelain=v2 || true
          git rev-parse --abbrev-ref HEAD || true

      - run: corepack enable && yarn set version 1.22.22
      - run: yarn install --frozen-lockfile
      - run: yarn add -D openai@^4 typescript tsx

      - name: Generate Review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MODEL_REVIEW: gpt-5
        run: |
          npx tsx tools/codex-review.ts || true
          # Placeholder if your script didn't emit a file
          [ -f codex-review.md ] || echo "No review generated." > codex-review.md
          ls -l codex-review.md

      - name: Upload Review
        uses: actions/upload-artifact@v4
        with:
          name: codex-review
          path: codex-review.md
