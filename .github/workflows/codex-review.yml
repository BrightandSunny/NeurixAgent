name: Codex Review (PR/Dispatch)

on:
  workflow_dispatch: {}
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches:
      - "main"
      - "release/**"

permissions:
  contents: read
  actions: read
  pull-requests: write

concurrency:
  group: codex-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node (cache Yarn)
        uses: actions/setup-node@v4
        with:
          node-version: "18.19.1"
          cache: "yarn"

      - name: Pin Yarn 1.22.22
        run: corepack enable && yarn set version 1.22.22

      - name: Install deps (frozen)
        run: yarn install --frozen-lockfile

      - name: Generate Review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: yarn codex:review
        continue-on-error: true

      - name: Upload Review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-review
          path: codex-review.md
          if-no-files-found: warn

      - name: Comment review on PR
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          script: |
            const runId = process.env.GITHUB_RUN_ID;
            const body = [
              "### Codex Review",
              `Run ID: ${runId}`,
              "Artifact: codex-review",
              "",
              "Download with GitHub CLI:",
              `gh run download ${runId} -n codex-review -D .artifacts`
            ].join("\n");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body
            });
