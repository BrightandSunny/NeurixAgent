name: Verify
on:
  pull_request:
  push:
    branches: [ main ]
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18.19.1'
      - run: corepack enable
      - run: yarn --version
      - run: yarn install --frozen-lockfile
      - run: yarn build || echo "No build step"
