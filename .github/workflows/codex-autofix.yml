name: codex-autofix
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  autofix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          submodules: false

      - uses: actions/setup-node@v4
        with:
          node-version: '18.19.1'

      - name: Git preflight
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          set -euxo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GH_REPO}.git"
          echo ".sandbox" >> .git/info/exclude || true
          git status --porcelain=v2 || true
          git rev-parse HEAD
          git rev-parse --abbrev-ref HEAD || true

      - name: Resolve PR branch (reattach)
        id: branch
        shell: bash
        run: |
          set -euxo pipefail
          BR="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          echo "name=$BR" >> "$GITHUB_OUTPUT"
          git fetch origin "$BR" --depth=50 || true
          git switch -C "$BR" || git checkout -B "$BR"
          git pull --rebase origin "$BR" || true
          git rev-parse --abbrev-ref HEAD

      - run: corepack enable && yarn set version 1.22.22
      - run: yarn install --frozen-lockfile
      - run: yarn add -D openai@^4 typescript tsx

      - name: Run Codex Autofix
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MODEL_CODEX: gpt-5-codex
          BRANCH: ${{ steps.branch.outputs.name }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euxo pipefail
          npx tsx tools/codex-fix.ts

      - name: Commit any changes (no-op safe)
        shell: bash
        run: |
          set -euxo pipefail
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(codex): autofix"
            git push --set-upstream origin "${{ steps.branch.outputs.name }}"
          fi

      - name: Ensure patch artifact vs remote
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          git diff --patch --binary "origin/${{ steps.branch.outputs.name }}"..."HEAD" > codex.patch || true
          ls -l codex.patch || true

      - name: Upload patch artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-patch
          path: codex.patch
