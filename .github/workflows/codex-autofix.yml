name: Codex Autofix (PR/Dispatch)
on:
  workflow_dispatch:
  pull_request:
    branches: ["main", "release/*"]

permissions:
  contents: write
  actions: read

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Git sanitize (quiet)
        shell: bash
        run: |
          set +e
          git config --global --add safe.directory "$GITHUB_WORKSPACE" 2>/dev/null || true
          git config --global --add safe.directory "*"                    2>/dev/null || true
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com" 2>/dev/null || true
          git config --global user.name  "github-actions[bot]"                                  2>/dev/null || true
          git -C "$GITHUB_WORKSPACE" rev-parse --is-inside-work-tree     >/dev/null 2>&1 || true
          git -C "$GITHUB_WORKSPACE" status --porcelain=v2               >/dev/null 2>&1 || true
          exit 0
      - uses: actions/setup-node@v4
        with:
          node-version: '18.19.1'
      - run: corepack enable && yarn set version 1.22.22
      - run: yarn install --frozen-lockfile
      - run: yarn add -D typescript tsx openai@^4
      - name: Run Codex Autofix (stub)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: yarn codex:fix
        continue-on-error: true
      - name: Upload patch artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-patch
          path: codex.patch
          if-no-files-found: warn
