name: Codex Autofix (PR/Dispatch)

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: ["main", "release/*"]

permissions:
  contents: read
  actions: read
  pull-requests: write

concurrency:
  group: codex-autofix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autofix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history for 3-way)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Git sanitize (quiet)
        shell: bash
        run: |
          set -euo pipefail
          git --version || :
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || :
          git config --global --add safe.directory "*" || :
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com" || :
          git config --global user.name  "github-actions[bot]" || :
          git rev-parse --is-inside-work-tree || :
          git status --porcelain=v2 || :

      - name: Setup Node (cache Yarn)
        uses: actions/setup-node@v4
        with:
          node-version: "18.19.1"
          cache: yarn

      - name: Pin Yarn 1.22.22
        run: corepack enable && yarn set version 1.22.22

      - name: Install deps (frozen)
        run: yarn install --frozen-lockfile

      - name: Typecheck (non-blocking)
        run: yarn -s typecheck
        continue-on-error: true

      - name: Generate patch (Codex Autofix)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: yarn codex:fix
        continue-on-error: true

      - name: Compute patch digest
        if: always()
        shell: bash
        run: |
          if [[ -f "codex.patch" ]]; then
            (shasum -a 256 codex.patch || sha256sum codex.patch) > codex.patch.sha256 || :
          else
            echo "codex.patch missing" > codex.patch.sha256
          fi

      - name: Upload patch artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-patch
          path: |
            codex.patch
            codex.patch.sha256
          if-no-files-found: warn

      - name: Comment patch on PR
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const runId = process.env.GITHUB_RUN_ID;
            const hasPatch = fs.existsSync('codex.patch');
            const digest = fs.existsSync('codex.patch.sha256') ? fs.readFileSync('codex.patch.sha256','utf8') : '(no digest)';
            const body = hasPatch
              ? `### 🤖 Codex Autofix patch ready
**Artifact:** \`codex-patch\`
**Run ID:** \`${runId}\`

**SHA-256:**
\`\`\`
${digest}
\`\`\`
**Apply locally:**
\`\`\`powershell
$rid='${runId}'
mkdir .artifacts -ea 0
gh run download $rid -n codex-patch -D .artifacts

git apply --3way .artifacts/codex.patch 2>$null; if ($LASTEXITCODE -ne 0) { git apply .artifacts/codex.patch }
\`\`\`
`
              : "Codex produced no patch (or the stub returned '# No changes').";
            if (github.context.payload.pull_request) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body
              });
            }
