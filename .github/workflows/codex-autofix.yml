name: codex-autofix
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  autofix:
    runs-on: ubuntu-latest
    permissions:
      contents: read        # artifact-only; no writes to repo
      pull-requests: write

    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
          persist-credentials: true
          submodules: false

      - uses: actions/setup-node@v4
        with:
          node-version: '18.19.1'

      # Make *any* repo path safe; never fail this step
      - name: Git sanitize (non-fatal)
        continue-on-error: true
        shell: bash
        run: |
          git --version
          pwd; ls -la .git || true
          git config --global --add safe.directory "*"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name  "github-actions[bot]"
          echo ".sandbox" >> .git/info/exclude || true
          git status --porcelain=v2 || true
          git rev-parse --abbrev-ref HEAD || true
          git remote -v || true

      - run: corepack enable && yarn set version 1.22.22
      - run: yarn install --frozen-lockfile
      - run: yarn add -D openai@^4 typescript tsx

      - name: Run Codex Autofix (no commit; produce diff)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MODEL_CODEX: gpt-5-codex
        shell: bash
        run: |
          # Run your fixer (let it modify the worktree if it wants)
          npx tsx tools/codex-fix.ts || true
          # Stage everything that changed (non-fatal)
          git add -A || true
          # Emit a *local* patch vs HEAD (no network; robust even detached)
          git diff --patch --binary --cached > codex.patch || true
          # If empty, make a tiny placeholder so artifact upload succeeds
          if [ ! -s codex.patch ]; then
            echo "# No changes from codex-fix" > codex.patch
          fi
          ls -l codex.patch

      - name: Upload patch artifact
        uses: actions/upload-artifact@v4
        with:
          name: codex-patch
          path: codex.patch
