# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Codex Autofix (PR/Dispatch)
on:
  workflow_dispatch: {}
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [main, release/**]
permissions:
  contents: read
  actions: read
  pull-requests: write
concurrency:
  group: codex-autofix-${{ github.ref }}
  cancel-in-progress: true
jobs:
  autofix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history for 3-way)
        uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Setup Node (cache Yarn)
        uses: actions/setup-node@v4
        with:
          node-version: "18.19.1"
          cache: yarn
      - name: Pin Yarn 1.22.22
        run: |
          corepack enable
          yarn set version 1.22.22
          yarn --version
      - name: Install deps (frozen)
        run: yarn install --frozen-lockfile
      - name: Typecheck (non-blocking)
        run: yarn -s typecheck
        continue-on-error: true
      - name: Generate patch (Codex Autofix)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: yarn codex:fix
        continue-on-error: true
      - name: Compute patch digest
        if: always()
        shell: bash
        run: |
          if [[ -f "codex.patch" ]]; then
            (shasum -a 256 codex.patch || sha256sum codex.patch) > codex.patch.sha256 || :
          else
            echo "codex.patch missing" > codex.patch.sha256
          fi
      - name: Upload patch artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-patch
          path: |
            codex.patch
            codex.patch.sha256
          if-no-files-found: warn
      - name: Comment patch on PR
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const runId = process.env.GITHUB_RUN_ID;
            const hasPatch = fs.existsSync('codex.patch');
            const digest = fs.existsSync('codex.patch.sha256')
              ? fs.readFileSync('codex.patch.sha256','utf8')
              : '(no digest)';
            const lines = [];
            if (hasPatch) {
              lines.push("### Codex Autofix patch ready");
              lines.push("Artifact: codex-patch");
              lines.push(`Run ID: ${runId}`);
              lines.push("");
              lines.push("SHA-256:");
              lines.push(digest.trim());
              lines.push("");
              lines.push("Apply locally (PowerShell):");
              lines.push(`$rid='${runId}'`);
              lines.push("mkdir .artifacts -ea 0");
              lines.push("gh run download $rid -n codex-patch -D .artifacts");
              lines.push("git apply --3way .artifacts/codex.patch 2>$null; if ($LASTEXITCODE -ne 0) { git apply .artifacts/codex.patch }");
            } else {
              lines.push("Codex produced no patch (or the stub returned '# No changes').");
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: lines.join("\n")
            });
