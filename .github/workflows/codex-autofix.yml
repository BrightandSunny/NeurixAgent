name: codex-autofix
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  autofix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          submodules: false

      - uses: actions/setup-node@v4
        with:
          node-version: '18.19.1'

      - name: Git preflight
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          echo ".sandbox" >> .git/info/exclude || true

      - name: Resolve branch
        id: branch
        shell: bash
        run: |
          BR="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          echo "name=$BR" >> "$GITHUB_OUTPUT"
          git fetch origin "$BR" || true
          git checkout -B "$BR" || true
          git pull --rebase origin "$BR" || true
          git status --porcelain=v2 || true

      - run: corepack enable && yarn set version 1.22.22
      - run: yarn install --frozen-lockfile
      - run: yarn add -D openai@^4 typescript tsx

      - name: Run Codex Autofix
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MODEL_CODEX: gpt-5-codex
          BRANCH: ${{ steps.branch.outputs.name }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: npx tsx tools/codex-fix.ts

      - name: Ensure patch artifact (compare to remote)
        if: always()
        shell: bash
        run: |
          git diff --patch --b
